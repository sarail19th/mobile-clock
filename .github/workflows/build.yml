name: Build APK

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

# Only this branch publishes the rolling "latest" release (and a push to `main`). Other sessions work in git
# worktrees on their own branches: CI still builds and uploads their APK as a workflow artifact, but it can
# never replace what the owner downloads from the release page.
env:
  DEPLOY_BRANCH: claude/new-session-wg4v13

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Signing, in priority order:
      #   1. KEYSTORE_BASE64 secret (a key kept entirely outside the repo)
      #   2. signing/clock-release.p12 in the repo (password-protected) + KEYSTORE_PASSWORD secret
      #   3. otherwise a throw-away DEBUG key: installable, but a different key every build, so it can NOT update an installed copy
      - name: Select signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEYSTORE_PASSWORD" ] && [ -f signing/clock-release.p12 ]; then
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/clock-release.p12" >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No KEYSTORE_PASSWORD secret - building with a throw-away DEBUG key. This APK cannot update an installed copy. Add the secret (see README)."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Version name from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Show signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          echo "Every build signed with the same key prints the same SHA-256 below (required for in-place updates):"
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256)"

      - name: Verify no INTERNET permission
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          echo "Permissions in $APK:"
          "$AAPT2" dump permissions "$APK"
          if "$AAPT2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::INTERNET permission found - this app must stay offline."
            exit 1
          fi

      - name: Name the APK
        id: apk
        run: |
          SUFFIX=""
          if [ "${{ steps.keystore.outputs.signed }}" = "debug" ]; then SUFFIX="-debugkey"; fi
          NAME="PersonalClock-${GITHUB_REF_NAME//\//-}-${{ github.run_number }}${SUFFIX}.apk"
          cp app/build/outputs/apk/release/*.apk "$NAME"
          cp app/build/outputs/apk/release/*.apk "PersonalClock-latest${SUFFIX}.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PersonalClock-apk
          path: PersonalClock-*.apk
          if-no-files-found: error

      # Tagged release (v*) -> GitHub Release the phone can download directly.
      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true

      # Rolling pre-release so the newest branch build always has a stable download link.
      - name: Move rolling "latest" tag
        if: github.ref == format('refs/heads/{0}', env.DEPLOY_BRANCH) || github.ref == 'refs/heads/main'
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
      # Keep exactly one APK on the rolling release: delete whatever the previous build left behind
      # (e.g. an old "-debugkey" file) so the wrong one can never be downloaded by mistake.
      - name: Remove stale assets from rolling release
        if: github.ref == format('refs/heads/{0}', env.DEPLOY_BRANCH) || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in PersonalClock-latest.apk PersonalClock-latest-debugkey.apk; do
            gh release delete-asset latest "$a" --yes -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          done
      - name: Publish rolling release (deploy branch)
        if: github.ref == format('refs/heads/{0}', env.DEPLOY_BRANCH) || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: PersonalClock-latest*.apk
          body: |
            Automatic build of branch `${{ github.ref_name }}` (${{ github.sha }}), run #${{ github.run_number }}.
            Signed with: **${{ steps.keystore.outputs.signed }}** key.
