name: Build APK

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - building with the DEBUG key. Add the secrets (see README) before relying on in-place updates."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Version name from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify no INTERNET permission
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)
          echo "Permissions in $APK:"
          "$AAPT2" dump permissions "$APK"
          if "$AAPT2" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::INTERNET permission found - this app must stay offline."
            exit 1
          fi

      - name: Name the APK
        id: apk
        run: |
          SUFFIX=""
          if [ "${{ steps.keystore.outputs.signed }}" = "debug" ]; then SUFFIX="-debugkey"; fi
          NAME="PersonalClock-${GITHUB_REF_NAME//\//-}-${{ github.run_number }}${SUFFIX}.apk"
          cp app/build/outputs/apk/release/*.apk "$NAME"
          cp app/build/outputs/apk/release/*.apk "PersonalClock-latest${SUFFIX}.apk"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PersonalClock-apk
          path: PersonalClock-*.apk
          if-no-files-found: error

      # Tagged release (v*) -> GitHub Release the phone can download directly.
      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true

      # Rolling pre-release so the newest branch build always has a stable download link.
      - name: Move rolling "latest" tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest
      - name: Publish rolling release (branch push)
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: PersonalClock-latest*.apk
          body: |
            Automatic build of branch `${{ github.ref_name }}` (${{ github.sha }}), run #${{ github.run_number }}.
            Signed with: **${{ steps.keystore.outputs.signed }}** key.
